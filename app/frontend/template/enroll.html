<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Computing University Enrollment</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-mark">CC</div>
    <div class="header-text">
      <h1>Cloud Computing University</h1>
      <p>Online Enrollment System</p>
    </div>
  </div>
</header>

<div class="page-wrap">

  <div class="notice">
    <span class="notice-icon">ℹ️</span>
    <span>Please fill out the enrollment form. Submission is final.</span>
  </div>

  <!-- ENROLLMENT FORM -->
  <form action="/submit" method="POST">

    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">🎓</div>
        <div>
          <h2>Enrollment Information</h2>
          <p>Basic student details</p>
        </div>
      </div>
  
      <div class="card-body">
  
        <!-- NAME (UPDATED) -->
        <div class="form-row cols-2">
          <div class="form-group">
            <label>First Name <span class="req">*</span></label>
            <input type="text" name="first_name" required>
          </div>
  
          <div class="form-group">
            <label>Last Name <span class="req">*</span></label>
            <input type="text" name="last_name" required>
          </div>
        </div>
  
        <!-- EMAIL + YEAR -->
        <div class="form-row cols-2">
          <div class="form-group">
            <label>Email Address <span class="req">*</span></label>
            <input type="email" name="email" required>
          </div>
  
          <div class="form-group">
            <label>Year Level <span class="req">*</span></label>
            <select name="year_level" required>
              <option value="">— Select —</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>
  
        <!-- COURSE + CAMPUS -->
        <div class="form-row cols-2">
          <div class="form-group">
            <label>Course / Program <span class="req">*</span></label>
            <select name="course" required>
              <option value="">— Select Course —</option>
              <option>BS Information Technology</option>
              <option>BS Computer Science</option>
              <option>BS Civil Engineering</option>
              <option>BS Business Administration</option>
            </select>
          </div>
  
          <div class="form-group">
            <label>Campus <span class="req">*</span></label>
            <select name="campus" required>
              <option value="">— Select Campus —</option>
              <option>Main Campus – Nabua</option>
              <option>Buhi Campus</option>
              <option>Moon Campus</option>
            </select>
          </div>
        </div>
  
        <!-- SUBMIT -->
        <div class="btn-row">
          <button type="submit" class="btn btn-gold">✓ Submit Enrollment</button>
        </div>
  
      </div>
    </div>
  
  </form>
</div>

</body>
</html>
