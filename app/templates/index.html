<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Enrollment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-mark">SE</div>
      <div class="header-text">
        <h1>Student Enrollment System</h1>
        <p>Cloud Web Application</p>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">📋</div>
        <div>
          <h2>Enrollment Form</h2>
          <p>Fill in your details to enroll</p>
        </div>
      </div>
      <div class="card-body">
        <div class="notice">
          ⚠️ Please make sure all information is correct before submitting.
        </div>
        <form action="/submit" method="POST">
          <div class="form-row cols-2">
            <div class="form-group">
              <label>Full Name <span class="req">*</span></label>
              <input type="text" name="full_name" required>
            </div>
            <div class="form-group">
              <label>Student ID <span class="req">*</span></label>
              <input type="text" name="student_id" required>
            </div>
          </div>
          <div class="form-row cols-1">
            <div class="form-group">
              <label>Email <span class="req">*</span></label>
              <input type="email" name="email" required>
            </div>
          </div>
          <div class="form-row cols-2">
            <div class="form-group">
              <label>Course <span class="req">*</span></label>
              <select name="course" required>
                <option value="">-- Select Course --</option>
                <option value="BSCS">BSCS</option>
                <option value="BSIT">BSIT</option>
                <option value="BSCOMENG">BSCOMENG</option>
                <option value="BSLIS">BSLIS</option>
                <option value="BSIS">BSIS</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year Level <span class="req">*</span></label>
              <select name="year_level" required>
                <option value="">-- Select Year --</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn-gold">Enroll Now</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
